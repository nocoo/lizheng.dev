<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(()=>{var t;try{t=localStorage.getItem('theme')}catch{}if(!t){try{t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}catch{t='light'}}document.documentElement.setAttribute('data-theme',t)})()</script>
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <link rel="alternate" hreflang="en" href="https://lizheng.me/en/" />
  <link rel="alternate" hreflang="zh" href="https://lizheng.me/zh/" />
  <link rel="alternate" hreflang="x-default" href="https://lizheng.me/en/" />
  <link rel="canonical" href="https://lizheng.me/{{lang}}/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="preload" as="image" href="/images/profile-176.webp" type="image/webp">
  <style>
    :root {
      --bg:        oklch(98% 0.006 85);
      --paper:     oklch(96% 0.008 85);
      --ink:       oklch(20% 0.025 260);
      --ink-soft:  oklch(38% 0.02 260);
      --muted:     oklch(50% 0.015 260);
      --rule:      oklch(86% 0.012 85);
      --tomato:    oklch(54% 0.18 35);
      --mint:      oklch(78% 0.10 165);
      --sun:       oklch(86% 0.13 95);
      --sky:       oklch(82% 0.07 230);

      --serif: 'Instrument Serif', 'Iowan Old Style', 'Charter', Georgia, serif;
      --sans:  'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono:  'IBM Plex Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace;

      --grid-line: oklch(20% 0.025 260 / 0.05);
    }

    [data-theme="dark"] {
      --bg:        oklch(20% 0.015 260);
      --paper:     oklch(24% 0.02 260);
      --ink:       oklch(92% 0.01 260);
      --ink-soft:  oklch(72% 0.015 260);
      --muted:     oklch(64% 0.02 260);
      --rule:      oklch(30% 0.015 260);
      --tomato:    oklch(68% 0.19 35);
      --mint:      oklch(70% 0.11 165);
      --sun:       oklch(75% 0.12 95);
      --sky:       oklch(72% 0.08 230);
      --grid-line: oklch(92% 0.01 260 / 0.06);
    }

    [data-theme="dark"] .flourish .blob {
      mix-blend-mode: screen;
    }

    [data-theme="dark"] .flourish .blob.b1 {
      opacity: 0.4;
    }

    [data-theme="dark"] .flourish .blob.b2 {
      opacity: 0.3;
    }

    [data-theme="dark"] .flourish .star {
      opacity: 0.35;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(24px, 4vw, 56px);
    }

    /* Topbar */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
    }
    .mark {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .mark .dot {
      width: 10px; height: 10px;
      background: var(--tomato);
      border-radius: 2px;
      transform: rotate(45deg);
    }
    .lang-pill {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      padding: 7px 14px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--paper);
      transition: border-color 0.15s, color 0.15s;
    }
    .lang-pill em { font-style: normal; color: var(--tomato); margin-right: 6px; }
    .lang-pill:hover { border-color: var(--ink); }

    /* Top-right action cluster: theme toggle + language pill */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .icon-btn:hover { border-color: var(--ink); }
    .icon-btn .icon-light,
    .icon-btn .icon-dark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn .icon-dark { display: none; }
    [data-theme="dark"] .icon-btn .icon-light { display: none; }
    [data-theme="dark"] .icon-btn .icon-dark { display: inline-flex; }

    /* Hero */
    .hero {
      display: grid;
      align-content: center;
      gap: clamp(20px, 3vh, 32px);
      padding: clamp(32px, 6vh, 64px) 0 clamp(24px, 4vh, 48px);
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .eyebrow::before {
      content: "";
      width: 28px; height: 1px;
      background: var(--ink-soft);
    }
    .hero-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: clamp(20px, 3vw, 32px);
      align-items: center;
    }
    .avatar {
      width: clamp(88px, 11vw, 120px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 0 6px 20px oklch(20% 0.025 260 / 0.12);
      overflow: hidden;
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(44px, 7vw, 88px);
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--ink);
    }
    h1 .it {
      font-style: italic;
      color: var(--tomato);
      position: relative;
      white-space: nowrap;
      display: inline-block;
    }
    h1 .it svg {
      position: absolute;
      left: -2%;
      right: -2%;
      bottom: -0.06em;
      width: 104%;
      height: 0.28em;
      pointer-events: none;
    }
    h1 .it svg path {
      fill: none;
      stroke: var(--tomato);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: scribble 1.4s 0.6s ease-out forwards;
    }
    @keyframes scribble { to { stroke-dashoffset: 0; } }

    .role {
      font-family: var(--sans);
      font-weight: 500;
      font-size: clamp(15px, 1.4vw, 17px);
      color: var(--ink);
    }
    .lede {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(20px, 2.2vw, 26px);
      line-height: 1.4;
      color: var(--ink-soft);
      max-width: 48ch;
    }

    /* Section label above portals */
    .doors-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: clamp(8px, 1.4vh, 16px);
    }

    /* Portal cards (2x2 grid for 4 links) */
    .doors {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(12px, 1.6vw, 18px);
      max-width: 1080px;
      width: 100%;
    }
    .door {
      position: relative;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 22px 24px 18px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 14px;
      color: var(--ink);
      text-decoration: none;
      min-height: 132px;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(.2,.7,.2,1), border-color 0.2s;
    }
    .door:hover {
      transform: translateY(-3px);
      border-color: var(--ink-soft);
    }
    .door:hover .arrow { transform: translate(4px, -4px); }
    .door:hover .deco { transform: scale(1.05) rotate(4deg); }
    .door .lang-name {
      font-family: var(--serif);
      font-size: clamp(26px, 2.6vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      align-self: end;
    }
    .door .lang-name em {
      font-style: italic;
      color: var(--tomato);
    }
    .door .lang-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--rule);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .arrow {
      width: 20px; height: 20px;
      transition: transform 0.25s cubic-bezier(.2,.7,.2,1);
      color: var(--ink);
      flex-shrink: 0;
    }
    .deco {
      position: absolute;
      top: 16px; right: 20px;
      transition: transform 0.4s cubic-bezier(.2,.7,.2,1);
      transform-origin: center;
    }

    /* Footer */
    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
    }
    .foot .stamp {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Background flourish */
    .flourish {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    .flourish .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: multiply;
      filter: blur(40px);
      opacity: 0.55;
    }
    .blob.b1 {
      top: -10vh; right: -8vw;
      width: 46vw; height: 46vw;
      background: var(--sun);
    }
    .blob.b2 {
      bottom: -16vh; left: -10vw;
      width: 40vw; height: 40vw;
      background: var(--mint);
      opacity: 0.4;
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px);
      background-size: 80px 100%;
    }
    .star {
      position: absolute;
      color: var(--tomato);
      animation: spin 16s linear infinite;
    }
    .star.s1 { top: 14%; left: 6%; width: 22px; height: 22px; opacity: 0.55; }
    .star.s2 { top: 72%; right: 9%; width: 26px; height: 26px; opacity: 0.4; animation-duration: 22s; animation-direction: reverse; color: var(--mint); }
    .star.s3 { top: 38%; right: 18%; width: 16px; height: 16px; opacity: 0.55; animation-duration: 28s; color: var(--sky); }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      body { overflow: auto; }
      .stage { padding: 22px 20px 28px; }
      .hero { padding: 24px 0; gap: 18px; }
      .hero-head { grid-template-columns: 1fr; gap: 16px; }
      .avatar { width: 80px; }
      h1 { font-size: clamp(40px, 11vw, 64px); line-height: 1.08; }
      h1 .it svg { bottom: -0.04em; height: 0.24em; }
      .doors { grid-template-columns: 1fr; }
      .door { min-height: 108px; padding: 18px 20px 14px; }
      .foot { flex-direction: column; align-items: flex-start; gap: 12px; }
      .blob.b1 { width: 70vw; height: 70vw; }
      .blob.b2 { width: 60vw; height: 60vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; }
      h1 .it svg path { stroke-dashoffset: 0; animation: none; }
    }
  </style>
</head>
<body>
  <div class="flourish" aria-hidden="true">
    <div class="grid-lines"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <svg class="star s1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 9 L21 10.5 L13.5 12 L12 19 L10.5 12 L3 10.5 L10.5 9 Z" /></svg>
    <svg class="star s2" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 9 L21 10.5 L13.5 12 L12 19 L10.5 12 L3 10.5 L10.5 9 Z" /></svg>
    <svg class="star s3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 9 L21 10.5 L13.5 12 L12 19 L10.5 12 L3 10.5 L10.5 9 Z" /></svg>
  </div>

  <main class="stage">
    <header class="top">
      <a class="mark" href="/"><span class="dot"></span>lizheng.me</a>
      <div class="top-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Switch to dark theme" aria-pressed="false">
          <span class="icon-light" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
          <span class="icon-dark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
        </button>
        <a class="lang-pill" href="../{{alternateLang}}/" hreflang="{{alternateLang}}" aria-label="Switch to 中文"><em>中</em>中文</a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-head">
        <picture>
          <source srcset="/images/profile-176.webp" type="image/webp">
          <img src="/images/profile-176.jpg" alt="{{name}}" class="avatar" width="120" height="120" decoding="async">
        </picture>
        <div>
          <span class="eyebrow">Hello · I'm</span>
          <h1><span class="it">{{name}}<svg viewBox="0 0 300 18" preserveAspectRatio="none"><path d="M3 12 C 50 4, 120 17, 180 9 S 250 5, 297 11" /></svg></span></h1>
        </div>
      </div>

      <p class="role">{{role}}</p>
      <p class="lede">{{{tagline}}}</p>

      <p class="doors-label">{{linksTitle}}</p>

      <nav class="doors" aria-label="Where to find me">
        <a class="door" href="https://lizheng.blog/" target="_blank" rel="noopener">
          <svg class="deco" width="40" height="40" viewBox="0 0 44 44" fill="none" aria-hidden="true">
            <rect x="8" y="10" width="28" height="24" rx="3" stroke="var(--sky)" stroke-width="1.4"/>
            <path d="M14 18 H30 M14 23 H26 M14 28 H22" stroke="var(--sky)" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="lang-name"><em>{{links.blog}}</em></span>
          <span class="lang-foot">
            <span>lizheng.blog</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 L17 7" />
              <path d="M8 7 H17 V16" />
            </svg>
          </span>
        </a>

        <a class="door" href="https://lizheng.dev/{{lang}}/" target="_blank" rel="noopener">
          <svg class="deco" width="40" height="40" viewBox="0 0 44 44" fill="none" aria-hidden="true">
            <circle cx="22" cy="22" r="20" stroke="var(--tomato)" stroke-width="1.4" stroke-dasharray="3 4"/>
            <path d="M14 22 L20 28 L31 16" stroke="var(--tomato)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="lang-name"><em>{{links.resume}}</em></span>
          <span class="lang-foot">
            <span>lizheng.dev</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 L17 7" />
              <path d="M8 7 H17 V16" />
            </svg>
          </span>
        </a>

        <a class="door" href="https://github.com/nocoo" target="_blank" rel="noopener">
          <svg class="deco" width="40" height="40" viewBox="0 0 44 44" fill="none" aria-hidden="true">
            <path d="M6 22 Q 22 6, 38 22 Q 22 38, 6 22 Z" stroke="var(--mint)" stroke-width="1.4"/>
            <circle cx="22" cy="22" r="3" fill="var(--mint)"/>
          </svg>
          <span class="lang-name"><em>{{links.github}}</em></span>
          <span class="lang-foot">
            <span>github.com/nocoo</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 L17 7" />
              <path d="M8 7 H17 V16" />
            </svg>
          </span>
        </a>

        <a class="door" href="https://linkedin.com/in/nocoo" target="_blank" rel="noopener">
          <svg class="deco" width="40" height="40" viewBox="0 0 44 44" fill="none" aria-hidden="true">
            <rect x="8" y="8" width="28" height="28" rx="4" stroke="var(--sun)" stroke-width="1.4"/>
            <path d="M16 18 V30 M16 14 V14.5 M22 30 V22 a4 4 0 0 1 8 0 V30" stroke="var(--sun)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="lang-name"><em>{{links.linkedin}}</em></span>
          <span class="lang-foot">
            <span>linkedin.com/in/nocoo</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 L17 7" />
              <path d="M8 7 H17 V16" />
            </svg>
          </span>
        </a>
      </nav>
    </section>

    <footer class="foot">
      <span class="stamp" id="copyright">{{copyright}}</span>
      <span class="stamp">made in Beijing</span>
    </footer>
  </main>

  <script>
    (function () {
      var el = document.getElementById('copyright');
      if (el) el.textContent = el.textContent.replace('{year}', new Date().getFullYear());
      var toggle = document.getElementById('theme-toggle');
      if (toggle) {
        var syncToggle = function () {
          var dark = document.documentElement.getAttribute('data-theme') === 'dark';
          toggle.setAttribute('aria-pressed', String(dark));
          toggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
        };
        syncToggle();
        toggle.addEventListener('click', function () {
          var cur = document.documentElement.getAttribute('data-theme');
          var next = cur === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch {}
          syncToggle();
        });
      }
    })();
  </script>
</body>
</html>
