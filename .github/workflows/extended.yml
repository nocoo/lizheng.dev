name: Performance lab

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    name: Cold load and interaction budgets
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Bun
        run: |
          npm install --prefix /tmp/bun --no-save --ignore-scripts @oven/bun-linux-x64@1.4.0
          echo "/tmp/bun/node_modules/@oven/bun-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install frozen dependencies without lifecycle scripts
        run: |
          test "$(node --version)" = "v26.13.1"
          test "$(bun --version)" = "1.4.0"
          bun install --frozen-lockfile --ignore-scripts
      - name: Resolve test hosts only to IPv4 loopback
        run: echo '127.0.0.1 resume.lizheng-test.localhost landing.lizheng-test.localhost www.resume.lizheng-test.localhost www.landing.lizheng-test.localhost' | tee -a /etc/hosts
      - run: bun run test:performance
        env:
          HOME: /root
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-${{ github.sha }}
          path: .test-results
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
