name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: Deploy Worker (production)
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
    with:
      package-manager: bun
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: blocked
      artifact-name: worker-${{ github.sha }}
      artifact-path: "."
      artifact-unpack-command: bash scripts/unpack-release.sh
      deploy-script: ./node_modules/.bin/wrangler deployments list && bun scripts/deploy-production.ts
      environment: production
      concurrency-group: deploy-lizheng-dev-production
      timeout-minutes: 15
      verify-command: bun scripts/verify-production.ts
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
