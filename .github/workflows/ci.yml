# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L2, Z1 via quality.yml;
# na L1.5, P1; L3 浏览器矩阵在 macOS 独立作业（darwin-ci 快照，quality.yml L3 仅 ubuntu）。nocoo/base-ci v2026.12.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: blocked
      coverage-path: coverage
      prepare-command: |
        bun run check:docs
        bun run check:deps
        bun run types:check
      test-command: bun run test:coverage
      lint-command: bun run lint
      typecheck-command: bun run typecheck
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:http
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "无 @cloudflare/vitest-pool-workers / miniflare 专属 Worker 运行时套件；Worker 逻辑在 L1 vitest 与 L2/L3 隔离服务中覆盖"},
        "L2": {"status": "impl"},
        "L3": {"status": "todo", "reason": "quality.yml 的 L3 作业固定在 ubuntu-latest，无法承载 darwin-ci 视觉回归、/etc/hosts 准备与 WebKit 三分片；完整实现见同工作流 macOS「L3: Browser E2E」矩阵作业"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}

  # L3: Browser E2E — macOS 矩阵（槽外承载项与 slot-status L3 todo 原因对应）
  l3-browser:
    name: "L3: Browser E2E (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }})"
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1
            shards: 1
            workers: 3
          - browser: firefox
            shard: 1
            shards: 1
            workers: 3
          - browser: webkit
            shard: 1
            shards: 3
            workers: 1
          - browser: webkit
            shard: 2
            shards: 3
            workers: 1
          - browser: webkit
            shard: 3
            shards: 3
            workers: 1
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: bun
          runtime-version: "1.4.0"
          node-version: "26.12.1"
          install-policy: blocked
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Resolve test hosts only to IPv4 loopback
        run: echo '127.0.0.1 resume.lizheng-test.localhost landing.lizheng-test.localhost www.resume.lizheng-test.localhost www.landing.lizheng-test.localhost' | sudo tee -a /etc/hosts
      - run: bun run test:browser --project=${{ matrix.browser }} --workers=${{ matrix.workers }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - if: matrix.browser == 'chromium'
        run: bun run test:development
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.shard }}-evidence-${{ github.sha }}
          path: |
            .test-results
            playwright-report
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  # 槽外：Release 产物校验与 worker-{sha} 归档（Release workflow 下载此制品）
  release-package:
    name: Release package verify
    needs: [quality, l3-browser]
    uses: nocoo/base-ci/.github/workflows/test-job.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: blocked
      timeout-minutes: 10
      command: |
        bun run check:hooks
        bun run check:budgets
        test -d dist
        ./node_modules/.bin/wrangler deploy --dry-run --outdir .release-worker
        tar -czf release-artifact.tgz dist .release-worker
        validation_dir=$(mktemp -d)
        (cd "$validation_dir" && bash "$GITHUB_WORKSPACE/scripts/unpack-release.sh" "$GITHUB_WORKSPACE/release-artifact.tgz")
      artifact-name: worker-${{ github.sha }}
      artifact-path: release-artifact.tgz
      artifact-retention-days: 14
