name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@830346a575841cee2808abab6001d0bfa8980c1a
    with:
      bun-version: "1.4.0"
      ignore-scripts: true
      pre-command: "bun run check:docs && bun run check:deps && bun run types:check"
      test-command: "bun run test:coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      enable-l2: "true"
      l2-command: "bun run test:http"
    secrets: inherit

  browser:
    name: L3 ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # Match the reviewed macOS 26 font rasterization for visual baselines.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Resolve test hosts only to IPv4 loopback
        run: echo '127.0.0.1 resume.lizheng-test.localhost landing.lizheng-test.localhost www.resume.lizheng-test.localhost www.landing.lizheng-test.localhost' | sudo tee -a /etc/hosts
      # Each engine owns its runner and workerd process. Reusing a single
      # macOS VM across all engines ended in runtime exits during WebKit.
      # Keep WebKit's video and axe pages from competing for rendering resources.
      - run: bun run test:browser --project=${{ matrix.browser }} --workers=${{ matrix.browser == 'webkit' && '1' || '3' }}
      - if: matrix.browser == 'chromium'
        run: bun run test:development
      - if: matrix.browser == 'chromium'
        run: bun run test:performance
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.browser }}-evidence-${{ github.sha }}
          path: |
            .test-results
            playwright-report
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  artifact:
    name: Verify and package Worker
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:hooks
      - run: bun run check:budgets
      - run: bunx wrangler deploy --dry-run --outdir .release-worker
      - run: tar -czf release-artifact.tgz dist .release-worker
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-${{ github.sha }}
          path: release-artifact.tgz
          if-no-files-found: error
          retention-days: 14
