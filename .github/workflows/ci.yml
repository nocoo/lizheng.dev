name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.4.0"
      node-version: "26.8.1"
      install-policy: "blocked"
      coverage-path: "coverage"
      prepare-command: |
        bun run check:docs
        bun run check:deps
        bun run types:check
      test-command: "bun run test:coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      l2: true
      l2-command: "bun run test:http"
    secrets: inherit

  browser:
    name: L3 ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.4.0"
          node-version: "26.8.1"
          install-policy: "blocked"
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Resolve test hosts only to IPv4 loopback
        run: echo '127.0.0.1 resume.lizheng-test.localhost landing.lizheng-test.localhost www.resume.lizheng-test.localhost www.landing.lizheng-test.localhost' | sudo tee -a /etc/hosts
      - run: bun run test:browser --project=${{ matrix.browser }} --workers=${{ matrix.browser == 'webkit' && '1' || '3' }}
      - if: matrix.browser == 'chromium'
        run: bun run test:development
      - if: matrix.browser == 'chromium'
        run: bun run test:performance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.browser }}-evidence-${{ github.sha }}
          path: |
            .test-results
            playwright-report
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  artifact:
    name: Verify and package Worker
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.4.0"
          node-version: "26.8.1"
          install-policy: "blocked"
      - run: bun run check:hooks
      - run: bun run check:budgets
      - run: ./node_modules/.bin/wrangler deploy --dry-run --outdir .release-worker
      - run: tar -czf release-artifact.tgz dist .release-worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-${{ github.sha }}
          path: release-artifact.tgz
          if-no-files-found: error
          retention-days: 14
