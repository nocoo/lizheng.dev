# Preserve CI-success -> production deployment, using the exact validated artifact.
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful main CI run whose artifact should be deployed"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-lizheng-dev-production
      cancel-in-progress: false
    steps:
      - name: Resolve validated main run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .head_branch == "main" and .event != "pull_request" and .head_repository.full_name == $repo and .path == ".github/workflows/ci.yml"' /tmp/run.json
          echo "sha=$(jq -r .head_sha /tmp/run.json)" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: worker-${{ steps.source.outputs.sha }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: tar -xzf release-artifact.tgz
      - name: Record rollback version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deployments list
      - name: Deploy validated Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy .release-worker/index.js --no-bundle
      - name: Verify both surfaces and redirects
        run: bun scripts/verify-production.ts
      - name: Summary
        if: always()
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          echo "Validated source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: lizheng-dev; https://lizheng.dev and https://lizheng.me" >> "$GITHUB_STEP_SUMMARY"
