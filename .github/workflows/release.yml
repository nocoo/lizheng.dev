name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful main CI run whose artifact should be deployed"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-lizheng-dev-production
      cancel-in-progress: false
    steps:
      - name: Resolve release source
        id: source
        uses: nocoo/base-ci/.github/actions/release-source@8cbdb970c3a38240289c1e152c40dd550ac62dba
        with:
          github-token: ${{ github.token }}
          expected-workflow-path: ".github/workflows/ci.yml"
          expected-workflow-name: "CI"
          source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.run_id }}
          allowed-source-events: "push,workflow_dispatch"
          require-fresh-main: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.target-sha }}
          persist-credentials: false

      - uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.4.0"
          node-version: "26.8.1"
          install-policy: "blocked"

      - uses: actions/download-artifact@v8.0.1
        with:
          name: worker-${{ steps.source.outputs.target-sha }}
          run-id: ${{ steps.source.outputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Confirm artifact identity
        run: |
          set -euo pipefail
          test -f release-artifact.tgz
          tar -tzf release-artifact.tgz | grep -q '^\.release-worker'
          tar -xzf release-artifact.tgz
          test -d dist
          test -d .release-worker

      - name: Record rollback version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deployments list

      - name: Deploy validated Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/deploy-production.ts

      - name: Verify both surfaces and redirects
        run: bun scripts/verify-production.ts
